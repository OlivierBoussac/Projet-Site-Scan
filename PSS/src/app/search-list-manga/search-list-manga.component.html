
<div class="search-list-container">
  <h2 class="title">Liste des Mangas</h2>
  <div class="manga-list-grid">
    <div *ngFor="let item of mangaListDisplay" class="manga-card" (click)="onMangaClick(item.id)">
      <img [src]="item.coverUrl || 'assets/placeholder-manga.png'" [alt]="item.name" />
      <div class="manga-title">{{ item.name }}</div>
    </div>
  </div>
</div>
